<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiktok live generator link - sarang monyet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #09090b;
      color: #f4f4f5;
    }
    .gradient-glow {
      background: radial-gradient(circle at 50% 0%, rgba(39, 39, 42, 0.45) 0%, transparent 65%);
    }
    .glass-card {
      background: rgba(18, 18, 23, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="min-h-screen gradient-glow flex flex-col justify-between p-4 md:p-8">

  <!-- Header -->
  <header class="max-w-3xl mx-auto w-full text-center py-8">
    <h1 class="text-3xl md:text-5xl font-black tracking-tight text-white mb-2 leading-tight">
      Tiktok live generator link<br>
      <span class="text-zinc-400 text-2xl md:text-4xl font-semibold">sarang monyet</span>
    </h1>
  </header>

  <!-- Main Content -->
  <main class="max-w-2xl mx-auto w-full flex-1">
    <!-- Form Card -->
    <div class="glass-card rounded-2xl p-6 md:p-8 shadow-2xl mb-6">
      <form id="convertForm" class="space-y-4">
        <div>
          <label for="tiktokUrl" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">
            Link TikTok Live atau Username
          </label>
          <div class="relative">
            <input 
              type="text" 
              id="tiktokUrl" 
              placeholder="https://vt.tiktok.com/... atau @username" 
              required
              class="w-full bg-zinc-950 border border-zinc-800 focus:border-zinc-500 focus:ring-2 focus:ring-zinc-500/20 text-white rounded-xl px-4 py-3.5 text-sm md:text-base outline-none transition placeholder-zinc-600 pr-24"
            >
            <button 
              type="button" 
              id="pasteBtn"
              class="absolute right-2 top-1/2 -translate-y-1/2 px-3 py-1.5 text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg transition border border-zinc-700 font-medium">
              Paste
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between text-xs text-zinc-400">
          <span>Contoh: <button type="button" id="exampleBtn" class="text-zinc-300 hover:underline">@mekaniktuax</button></span>
          <span id="charCount"></span>
        </div>

        <button 
          type="submit" 
          id="submitBtn"
          class="w-full bg-white hover:bg-zinc-200 text-black font-bold py-3.5 px-6 rounded-xl transition duration-200 shadow-lg shadow-white/5 flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50">
          <svg id="btnIcon" class="w-5 h-5 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <span id="btnText">Generate Link Stream</span>
        </button>
      </form>
    </div>

    <!-- Error/Alert Banner -->
    <div id="alertBox" class="hidden glass-card rounded-2xl p-5 border-l-4 border-amber-500 mb-6 transition">
      <div class="flex items-start gap-3">
        <span class="text-amber-400 text-xl font-bold">⚠️</span>
        <div>
          <h4 id="alertTitle" class="font-bold text-white text-sm">Pemberitahuan</h4>
          <p id="alertMessage" class="text-zinc-300 text-xs md:text-sm mt-1"></p>
        </div>
      </div>
    </div>

    <!-- Result Card -->
    <div id="resultCard" class="hidden glass-card rounded-2xl p-6 md:p-8 shadow-2xl space-y-5 animate-fade-in">
      <!-- Stream Info Header -->
      <div class="flex items-center justify-between border-b border-zinc-800 pb-4">
        <div>
          <div class="flex items-center gap-2 mb-1">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-bold bg-zinc-800 text-zinc-200 border border-zinc-700">
              <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
              LIVE
            </span>
            <span id="resViewers" class="text-xs text-zinc-400 font-medium bg-zinc-900 border border-zinc-800 px-2.5 py-0.5 rounded-full"></span>
          </div>
          <h2 id="resTitle" class="text-base md:text-lg font-bold text-white line-clamp-1"></h2>
          <p id="resHost" class="text-xs md:text-sm text-zinc-400 font-semibold"></p>
        </div>
      </div>

      <!-- Built-in Video Player -->
      <div class="relative rounded-xl overflow-hidden bg-black aspect-video border border-zinc-800 shadow-inner">
        <video id="videoPlayer" controls playsinline class="w-full h-full object-contain"></video>
      </div>

      <!-- Direct M3U8 Link Output -->
      <div class="space-y-2">
        <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400">
          URL Stream .m3u8 (Direct HLS)
        </label>
        <div class="flex gap-2">
          <input 
            type="text" 
            id="m3u8Output" 
            readonly 
            class="flex-1 bg-zinc-950 border border-zinc-800 text-zinc-200 rounded-xl px-3.5 py-2.5 text-xs font-mono outline-none select-all"
          >
          <button 
            type="button" 
            id="copyBtn"
            class="px-4 py-2.5 bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap">
            <span id="copyText">Salin</span>
          </button>
        </div>
      </div>

      <!-- Quick Action Buttons -->
      <div class="grid grid-cols-2 gap-3 pt-2">
        <a 
          id="safariBtn" 
          href="#" 
          target="_blank" 
          class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-xs font-semibold text-zinc-200 transition">
          🍏 Buka di Safari/iOS
        </a>
        <a 
          id="vlcBtn" 
          href="#" 
          class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-xs font-semibold text-zinc-200 transition">
          🟠 Putar di VLC
        </a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="max-w-2xl mx-auto w-full text-center py-8 text-xs text-zinc-500 space-y-1.5">
    <p>sarang monyet &middot; stream direct extractor</p>
    <p>&copy; 2026 Crafted by <a href="https://www.instagram.com/dferdiantn" target="_blank" rel="noopener noreferrer" class="text-zinc-400 hover:text-white font-medium underline underline-offset-4 transition">@dferdiantn</a></p>
  </footer>

  <script>
    const form = document.getElementById('convertForm');
    const tiktokUrl = document.getElementById('tiktokUrl');
    const pasteBtn = document.getElementById('pasteBtn');
    const exampleBtn = document.getElementById('exampleBtn');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    
    const alertBox = document.getElementById('alertBox');
    const alertTitle = document.getElementById('alertTitle');
    const alertMessage = document.getElementById('alertMessage');

    const resultCard = document.getElementById('resultCard');
    const resTitle = document.getElementById('resTitle');
    const resHost = document.getElementById('resHost');
    const resViewers = document.getElementById('resViewers');
    const m3u8Output = document.getElementById('m3u8Output');
    const copyBtn = document.getElementById('copyBtn');
    const copyText = document.getElementById('copyText');
    const videoPlayer = document.getElementById('videoPlayer');
    const safariBtn = document.getElementById('safariBtn');
    const vlcBtn = document.getElementById('vlcBtn');

    let hlsInstance = null;

    // Paste from clipboard
    pasteBtn.addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        tiktokUrl.value = text;
      } catch (err) {
        tiktokUrl.focus();
      }
    });

    exampleBtn.addEventListener('click', () => {
      tiktokUrl.value = 'https://www.tiktok.com/@mekaniktuax';
      form.requestSubmit();
    });

    // Form Submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const val = tiktokUrl.value.trim();
      if (!val) return;

      // Loading state
      submitBtn.disabled = true;
      btnText.textContent = 'Mengekstrak Siaran...';
      btnIcon.classList.add('animate-spin');
      hideAlert();
      resultCard.classList.add('hidden');

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      videoPlayer.pause();
      videoPlayer.removeAttribute('src');

      try {
        const apiUrl = `/api/convert?url=${encodeURIComponent(val)}`;
        const res = await fetch(apiUrl);
        const data = await res.json();

        if (data.status === 'live' && data.m3u8_url) {
          showResult(data);
        } else if (data.status === 'offline') {
          showAlert('Akun Sedang Offline', data.message || `Akun @${data.username} saat ini tidak sedang live.`, 'amber');
        } else if (data.status === 'ended') {
          showAlert('Live Telah Berakhir', data.message || 'Siaran streaming telah selesai.', 'amber');
        } else {
          showAlert('Gagal Mengonversi', data.message || 'Tidak dapat menemukan siaran live.', 'red');
        }
      } catch (err) {
        showAlert('Koneksi Gagal', 'Terjadi kesalahan saat menghubungi API converter: ' + err.message, 'red');
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = 'Generate Link Stream';
        btnIcon.classList.remove('animate-spin');
      }
    });

    function showResult(data) {
      resTitle.textContent = data.title || 'TikTok LIVE';
      resHost.textContent = `@${data.username}`;
      resViewers.textContent = `👥 ${Number(data.viewers || 0).toLocaleString()} Penonton`;
      m3u8Output.value = data.m3u8_url;
      safariBtn.href = data.m3u8_url;
      vlcBtn.href = `vlc://${data.m3u8_url}`;

      // Inisialisasi Player
      const streamUrl = data.m3u8_url;
      if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
        // Native HLS (Safari iOS, macOS)
        videoPlayer.src = streamUrl;
      } else if (Hls.isSupported()) {
        // Browser non-Safari (Chrome, Firefox, Edge) via hls.js
        hlsInstance = new Hls({ enableWorker: true });
        hlsInstance.loadSource(streamUrl);
        hlsInstance.attachMedia(videoPlayer);
      } else {
        videoPlayer.src = streamUrl;
      }

      resultCard.classList.remove('hidden');
      resultCard.scrollIntoView({ behavior: 'smooth' });
    }

    // Copy to clipboard
    copyBtn.addEventListener('click', () => {
      m3u8Output.select();
      navigator.clipboard.writeText(m3u8Output.value).then(() => {
        copyText.textContent = 'Tersalin! ✓';
        setTimeout(() => { copyText.textContent = 'Salin'; }, 2000);
      });
    });

    function showAlert(title, message, color = 'amber') {
      alertTitle.textContent = title;
      alertMessage.textContent = message;
      alertBox.className = `glass-card rounded-2xl p-5 border-l-4 border-${color}-500 mb-6 transition block`;
      alertBox.scrollIntoView({ behavior: 'smooth' });
    }

    function hideAlert() {
      alertBox.classList.add('hidden');
    }
  </script>
</body>
</html>
